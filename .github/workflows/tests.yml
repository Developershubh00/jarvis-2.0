name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install "anthropic>=1.11,<2" PyYAML python-dotenv numpy Pillow pypdf
      - name: Check Python syntax
        run: python -m compileall -q jarvis tests
      - name: Check shell scripts
        run: bash -n setup.sh && bash -n run.sh
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
